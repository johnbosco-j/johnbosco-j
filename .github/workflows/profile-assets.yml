name: Update profile assets

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["assets/stats/**"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Set a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
      - name: Build SVGs
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update profile stats [skip ci]"
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#E63946&color_dots=#EBEDF0,#C7D7FF,#8FB2FF,#2F6BFF,#0A0E27
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF4D5A&color_dots=#161B33,#1E3A8A,#2F6BFF,#8FB2FF,#FFC857

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
