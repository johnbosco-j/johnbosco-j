name: Update profile assets

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["assets/stats/**"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Set a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
      - name: Build SVGs
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update profile stats [skip ci]"
            git push
          fi
